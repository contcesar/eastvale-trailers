[build]
  command = "astro build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security + caching headers (optional but sensible defaults).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
